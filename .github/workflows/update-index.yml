name: 更新索引

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Packages
        run: python3 scripts/make_index.py

      - name: 提交索引
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages
          if git diff --staged --quiet; then
            echo "索引无变化，跳过"
          else
            git commit -m "chore: 更新 Packages 索引"
            git push
          fi
